<!DOCTYPE html>
<html>

<head>
    <title>FAMA AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="chat-container">

    <h2>🌱 FAMA AI Chatbot</h2>

    <div id="chat-box"></div>


    <div class="input-area">

        <input 
        id="question"
        placeholder="Tanya sesuatu tentang FAMA..."
        onkeypress="handleEnter(event)"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>


</div>


<script src="script.js"></script>


</body>

</html>
